groups:
  - name: Filesystem
    rules:
      - alert: "HostOutOfDiskSpace"
        expr: (node_filesystem_avail_bytes * 100) / node_filesystem_size_bytes < 15 and ON (instance, device, mountpoint) node_filesystem_readonly == 0
        for: 1m
        labels:
          severity: "warning"
        annotations:
          summary: "Host out of disk space ({{ $labels.instance }})"
          description: "Disk is almost full (< 15% left)"
          value: "{{ $value }} %"
      - alert: "HostDiskWillFillIn24Hours"
        expr: (node_filesystem_avail_bytes * 100) / node_filesystem_size_bytes < 15 and ON (instance, device, mountpoint) predict_linear(node_filesystem_avail_bytes{fstype!~"tmpfs"}[1h], 24 * 3600) < 0 and ON (instance, device, mountpoint) node_filesystem_readonly == 0
        for: 1m
        labels:
          severity: "warning"
        annotations:
          summary: "Host disk will fill in 24 hours ({{ $labels.instance }})"
          description: "Filesystem is predicted to run out of space within the next 24 hours at current write rate"
          value: "{{ $value }} %"
      - alert: ContainerHighMemoryUsage
        expr: (sum(container_memory_working_set_bytes{name!=""}) BY (instance, name) / sum(container_spec_memory_limit_bytes > 0) BY (instance, name) * 100) > 80
        for: 1m
        labels:
          severity: "warning"
        annotations:
          summary: Container High Memory usage (instance {{ $labels.instance }})
          description: "Container Memory usage is above 80%\n  VALUE = {{ $value }}\n  LABELS = {{ $labels }}"
